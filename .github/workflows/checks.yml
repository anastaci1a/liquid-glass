name: Research checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  docs-and-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: python -m pip install -r reconstruction/requirements.txt
      - run: python -m unittest discover -s reconstruction -p 'test_geometric*.py'
